{% extends "base.html" %}
{% block content %}
<h2>registrar salida</h2>
<form method="POST">
    <label>numero de ticket</label>
    <input type="number" name="ticket_id" required>
    <br>
    <label>horas de estancia</label>
    <input type="number" step="0.1" name="hours" required>
    <br><br>
    <button type="submit">cobrar y liberar</button>
</form>
{% endblock %}
